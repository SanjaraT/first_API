services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: sanju
      POSTGRES_DB: tasks
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:sanju@db:5432/tasks
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: